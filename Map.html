<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    .map-container {
      width: 100%;
      height: 500px;
      border: 2px solid #333;
    }
    h1 {
      background: #4CAF50;
      color: white;
      padding: 10px;
    }
  </style>
</head>
<body>
  <h1>My Location Map</h1>
  <div class="map-container">
    <!-- Google Maps iframe -->
    <iframe 
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3559.572!2d80.9345!3d26.8467!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x399be2!2sLucknow!5e0!3m2!1sen!2sin!4v1626780000000!5m2!1sen!2sin" 
      width="100%" 
      height="100%" 
      style="border:0;" 
      allowfullscreen="" 
      loading="lazy">
    </iframe>
  </div>
</body>
</html>
